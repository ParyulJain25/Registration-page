<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center">
        <div class="top">
            <img src="Persona logo.jpg" alt="Persona logo" height="120" width="120" class="image">
            <h1>Register</h1>
        </div>
        <form action="" method="post">
            <!-- <h4>Name</h4> -->
            <input type="text" class="input" placeholder="Enter your Name" required><br><br>
            <input type="email" class="input"  placeholder="Enter your Email" required><br><br>
            <input type="tel" pattern="[0-9]{10}" class="input"  placeholder="Phone number" required><br><br>
            <input type="text" class="input"  placeholder="Year of admission" required><br><br>
            <input type="textbox" class="input"  placeholder="Enter your interests"><br><br>
            <input type="submit">
        </form>
    </div>
</body>
</html>
